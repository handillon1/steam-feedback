name: Player counts

on:
  schedule:
    - cron: "7 */4 * * *"       # every 4 hours at minute 7 (D14); hourly would exceed the free Actions minutes
  workflow_dispatch:            # adds a "Run workflow" button for manual runs

permissions:
  contents: write               # lets the job push the data commit

concurrency:
  group: data-commit            # same group in both workflows: they queue instead of pushing at once
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90         # backstop if Steam is slow; normal runs take ~6 min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Collect player counts
        run: python -m collector.players
      - name: Check data
        if: ${{ !cancelled() }}
        run: python -m checks.players
      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players
          git diff --cached --quiet && exit 0
          git commit -m "Player counts $(date -u +%FT%H)"
          git pull --rebase
          git push